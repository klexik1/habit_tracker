spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/habit_tracker
    username: postgres
    password: 123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

jwt:
  secret: habit-tracker-secret-key-must-be-at-least-32-bytes-long
  expiration: 86400000
