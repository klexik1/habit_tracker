<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер привычек</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Трекер привычек</h1>
            <nav id="nav" style="display: none;">
                <button onclick="showSection('habits')">Привычки</button>
                <button onclick="showSection('analytics')">Аналитика</button>
                <button onclick="logout()">Выйти</button>
            </nav>
        </header>

        <!-- Авторизация -->
        <section id="auth-section">
            <div class="auth-container">
                <h2>Вход</h2>
                <form id="login-form">
                    <input type="text" id="login-username" placeholder="Имя пользователя" required>
                    <input type="password" id="login-password" placeholder="Пароль" required>
                    <button type="submit">Войти</button>
                </form>
                <p>Нет аккаунта? <a href="#" onclick="showRegister()">Зарегистрироваться</a></p>
            </div>

            <div class="auth-container" id="register-container" style="display: none;">
                <h2>Регистрация</h2>
                <form id="register-form">
                    <input type="text" id="reg-username" placeholder="Имя пользователя" required>
                    <input type="email" id="reg-email" placeholder="Email" required>
                    <input type="password" id="reg-password" placeholder="Пароль (мин. 6 символов)" required minlength="6">
                    <button type="submit">Зарегистрироваться</button>
                </form>
                <p>Есть аккаунт? <a href="#" onclick="showLogin()">Войти</a></p>
            </div>
        </section>

        <!-- Привычки -->
        <section id="habits-section" style="display: none;">
            <div class="form-card">
                <h3>Новая привычка</h3>
                <form id="habit-form">
                    <div class="form-group">
                        <label for="habit-name">Название привычки *</label>
                        <input type="text" id="habit-name" placeholder="Например: утренняя пробежка" required>
                    </div>
                    <div class="form-group">
                        <label for="habit-description">Описание</label>
                        <textarea id="habit-description" placeholder="Дополнительные детали..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="habit-category">Категория *</label>
                        <select id="habit-category" required>
                            <option value="OTHER" selected>📌 Другое</option>
                            <option value="SPORT">🏃 Спорт</option>
                            <option value="READING">📚 Чтение</option>
                            <option value="STUDY">📖 Учёба</option>
                            <option value="HEALTH">💪 Здоровье</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="habit-frequency">Частота выполнения *</label>
                        <select id="habit-frequency" required>
                            <option value="DAILY">📅 Каждый день</option>
                            <option value="WEEKLY">📆 Каждую неделю</option>
                            <option value="MONTHLY">📅 Каждый месяц</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="habit-type">Тип привычки *</label>
                        <select id="habit-type" required>
                            <option value="SINGLE">☑️ Одноразовая — выполняется 1 раз в день</option>
                            <option value="MULTIPLE">🔁 Многоразовая — можно отмечать несколько раз</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="habit-reminder">⏰ Время напоминания</label>
                        <input type="time" id="habit-reminder" title="Время напоминания">
                    </div>
                    <button type="submit">Создать привычку</button>
                </form>
            </div>

            <h2 class="section-title">📋 Мои привычки</h2>
            <div class="habit-filters">
                <label class="filter-toggle">
                    <input type="checkbox" id="filter-single" checked onchange="loadHabits()">
                    <span>☑️ Одноразовые</span>
                </label>
                <label class="filter-toggle">
                    <input type="checkbox" id="filter-multiple" checked onchange="loadHabits()">
                    <span>🔁 Многоразовые</span>
                </label>
            </div>
            <div id="habits-list"></div>
        </section>

        <!-- Аналитика -->
        <section id="analytics-section" style="display: none;">
            <h2>📈 Аналитика</h2>

            <div class="habit-selector">
                <label>Выберите привычку:</label>
                <select id="analytics-habit-select" onchange="loadHabitAnalytics()">
                    <option value=""></option>
                </select>
            </div>

            <div id="analytics-overall"></div>

            <div id="analytics-content">
            </div>
        </section>

        <!-- Модалка редактирования -->
        <div id="edit-modal" class="modal">
            <div class="modal-content">
                <h3>✏️ Редактировать привычку</h3>
                <form id="edit-habit-form" onsubmit="saveHabitEdit(event)">
                    <input type="hidden" id="edit-habit-id">
                    <div class="form-group">
                        <label>Название</label>
                        <input type="text" id="edit-habit-name" required>
                    </div>
                    <div class="form-group">
                        <label>Описание</label>
                        <textarea id="edit-habit-description" rows="3" maxlength="500"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Категория</label>
                        <select id="edit-habit-category">
                            <option value="OTHER">📌 Другое</option>
                            <option value="SPORT">🏃 Спорт</option>
                            <option value="READING">📚 Чтение</option>
                            <option value="STUDY">📖 Учёба</option>
                            <option value="HEALTH">💪 Здоровье</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Частота выполнения</label>
                        <select id="edit-habit-frequency">
                            <option value="DAILY">📅 Каждый день</option>
                            <option value="WEEKLY">📆 Каждую неделю</option>
                            <option value="MONTHLY">📅 Каждый месяц</option>
                        </select>
                    </div>
                    <div class="form-group" id="edit-target-group" style="display:none;">
                        <label>Цель на день</label>
                        <input type="number" id="edit-habit-target" min="0" value="1">
                    </div>
                    <div class="modal-actions">
                        <button type="submit" class="btn-save">💾 Сохранить</button>
                        <button type="button" class="btn-cancel" onclick="closeEditModal()">❌ Отмена</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Уведомления -->
        <div id="notification"></div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
